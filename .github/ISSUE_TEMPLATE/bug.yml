name: Bug
description: The build, a check or the page does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, or the tab, language and screen size.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and operating system, or browser
